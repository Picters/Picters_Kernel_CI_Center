name: Build All Projects
on:
  workflow_dispatch:
    inputs:
      do_release:
        description: 'Create GitHub Releases for every build'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Build CI Core
        uses: ./.github/actions/build-core

      - name: Generate Matrix
        id: set-matrix
        run: ./Picters matrix-all

  build:
    needs: matrix
    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/build_kernel.yml
    with:
      project: ${{ matrix.project }}
      branch: ${{ matrix.branch }}
      ksu_variant: ${{ matrix.ksu_variant }}
      do_release: ${{ inputs.do_release }}
      apply_susfs: false
      apply_bbg: false
    secrets: inherit
