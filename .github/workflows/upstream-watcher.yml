name: Watch Upstream KernelSU
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.watcher.outputs.matrix }}
      found_updates: ${{ steps.watcher.outputs.found_updates }}
    steps:
      - uses: actions/checkout@v7

      - name: Build CI Core
        uses: ./.github/actions/build-core
          
      - name: Check Upstream
        id: watcher
        run: ./Picters watch
        
      - name: Commit Updated Tracker
        if: steps.watcher.outputs.found_updates == 'true'
        run: |
          git config --global user.name "Picters"
          git config --global user.email "imelikov3@bk.ru"
          git add configs/upstream_commits.json
          git commit -m "ci: update upstream records"
          git push

  update-projects:
    needs: check
    if: needs.check.outputs.found_updates == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build CI Core
        uses: ./.github/actions/build-core
          
      - name: Perform Update
        run: |
          ./Picters update \
            --token "${{ secrets.GH_TOKEN }}" \
            --project "${{ matrix.project }}" \
            --variant "${{ matrix.variant }}" \
            --commit-id "${{ matrix.commit_id }}"
