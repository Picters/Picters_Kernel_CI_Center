name: Local Mode Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-and-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Rust format
        run: cargo fmt --manifest-path ci_core_rs/Cargo.toml --check

      - name: Rust check
        run: cargo check --manifest-path ci_core_rs/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path ci_core_rs/Cargo.toml

      - name: Wrapper tests
        run: |
          ./scripts/check-shell.sh
          ./scripts/test-picters-cli.sh

      - name: Picters validation
        run: |
          ./picters validate
          ./picters plan mi17_sm8850 resukisu default --no-susfs --no-bbg

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build local image
        run: docker build -t picters-local .

      - name: Smoke test in container
        run: |
          docker run --rm -v "$PWD":/workspace picters-local ./picters validate
          docker run --rm -v "$PWD":/workspace picters-local ./picters plan mi17_sm8850 resukisu default --no-susfs --no-bbg
